name: Dev Publish (npm beta)

# 在 dev-* 分支 push 时自动发布 beta 包
# - 版本号：<base>-dev.<short-sha>（如 0.12.0-dev.abc1234）
# - npm tag：beta（用户通过 npm install llm-simple-router@beta 安装）

on:
  push:
    branches:
      - 'dev-*'
  workflow_dispatch:
    inputs:
      base_version:
        description: '基础版本号（覆盖分支名推断）'
        required: false
        type: string

concurrency:
  group: dev-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-beta:
    # 仅在 PR 合并（commit message 以 "Merge pull request" 开头）或手动触发时发布
    # 避免首次 push 分支时浪费一次 beta 发布
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge pull request'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Compute beta version
        id: version
        run: |
          # 提取 dev-* 中的 base 版本号
          # 例如 dev-0.12.0 → 0.12.0
          BRANCH="${{ github.ref_name }}"
          if [ -n "${{ inputs.base_version }}" ]; then
            BASE_VERSION="${{ inputs.base_version }}"
          elif [[ "$BRANCH" =~ ^dev-(.+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
          else
            echo "Error: branch $BRANCH is not dev-*" >&2
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          BETA_VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "beta_version=$BETA_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved beta version: $BETA_VERSION"

      - name: Update package.json version
        working-directory: router
        run: |
          npm version "${{ steps.version.outputs.beta_version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build router
        run: cd router && npm run build

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Run prepublish (migrations + frontend-dist)
        working-directory: router
        run: node scripts/prepublish.mjs

      - name: Publish to npm with tag=beta
        run: |
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          cd router && npm publish --tag beta

      - name: Print install instructions
        run: |
          echo "=========================================="
          echo "Beta version published: ${{ steps.version.outputs.beta_version }}"
          echo ""
          echo "Install with:"
          echo "  npm install -g llm-simple-router@${{ steps.version.outputs.beta_version }}"
          echo "  # or install latest beta:"
          echo "  npm install -g llm-simple-router@beta"
          echo "=========================================="
